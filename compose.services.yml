# Microservices overlay (P1b): runs the gateway + four Bun services + the
# Node worker in containers, on top of the base infra (postgres/kafka/
# temporal) in docker-compose.yml. The default compose workflow is unchanged
# (all services here carry the `microservices` profile).
#
# Exact command (run from the workspace root):
#   docker compose -f docker-compose.yml -f compose.services.yml --profile microservices up -d --wait
# Tear down only the overlay (infra keeps running):
#   docker compose -f docker-compose.yml -f compose.services.yml --profile microservices down
#
# How it works:
# - `deps` is a one-shot installer (node:26-slim): the repo is bind-mounted
#   at /app and Linux-native node_modules are installed into the named
#   `svc-node-modules` volume at /app/node_modules (the host's Windows
#   node_modules are shadowed, never used). Every other service mounts the
#   same two volumes and waits for `deps` to complete successfully.
# - Bun services run `bun src/server.ts` with cwd /app; each server.ts loads
#   /app/.env by path, but the explicit `environment:` below wins (dotenv
#   never overrides real env), so container networking is wired here.
#   Image is oven/bun:1.4.3 — the newest numeric tag on Docker Hub
#   (1.4.4 exists only as a local canary; 1.4.3 === latest as of 2026-10-19).
# - Secrets (SESSION_SECRET/INTERNAL_SECRET) interpolate from the root .env
#   (compose loads it automatically) — they are never committed.
# - The web app stays local (`pnpm --filter @credit/web dev` on :3000,
#   proxying /api → 127.0.0.1:3001): Vite dev belongs on the host.
#
# First run takes several minutes (`deps` installs the full workspace, then
# each Bun service compiles on first boot). If the sandbox has no Docker
# daemon or no network for pulls, skip `up` — `config` validation below is
# the offline gate:
#   docker compose -f docker-compose.yml -f compose.services.yml --profile microservices config

x-svc-base: &svc-base
  volumes:
    - .:/app
    - svc-node-modules:/app/node_modules
  restart: unless-stopped
  profiles: ["microservices"]

services:
  deps:
    <<: *svc-base
    image: node:26-slim
    working_dir: /app
    # One-shot: must complete before any service starts (see depends_on).
    # Node 25+ unships corepack, so pnpm comes from npm (pinned to the
    # workspace's packageManager version).
    command:
      [
        "sh",
        "-c",
        "npm install -g pnpm@12.11.2 --no-audit --no-fund && pnpm install --frozen-lockfile",
      ]
    restart: "no"

  applications:
    <<: *svc-base
    image: oven/bun:1.4.3
    working_dir: /app
    command: ["bun", "apps/applications/src/server.ts"]
    ports: ["4001:4001"]
    environment: &applications-env
      APPLICATIONS_DATABASE_URL: postgres://credit:credit@postgres:5432/credit_applications
      TEMPORAL_ADDRESS: temporal:7233
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      # T18 consent-withdrawal purge callback (SPEC-t17-t18 §2.3): the
      # applications service calls research inside the compose network.
      RESEARCH_URL: http://research:4005
      # EN-01/02/03 case assist (off by default). Research stays optional:
      # the assembler records a typed unavailable source when it cannot reach it.
      ASSIST_ENABLED: ${ASSIST_ENABLED:-false}
      ASSIST_RETENTION_DAYS: ${ASSIST_RETENTION_DAYS:-90}
      ASSIST_RESEARCH_TIMEOUT_MS: ${ASSIST_RESEARCH_TIMEOUT_MS:-5000}
      ASSIST_MODEL: ${ASSIST_MODEL:-deterministic}
      ASSIST_PROMPT_VERSION: ${ASSIST_PROMPT_VERSION:-memo-template-v1}
      ASSIST_ADVERSE_JURISDICTION: ${ASSIST_ADVERSE_JURISDICTION:-SG}
      ASSIST_ADVERSE_CONTACT_PATH: ${ASSIST_ADVERSE_CONTACT_PATH:-}
      ASSIST_ADVERSE_PROMPT_VERSION: ${ASSIST_ADVERSE_PROMPT_VERSION:-adverse-letter-v1}
      ASSIST_POLICY_EXCEPTION_ENABLED: ${ASSIST_POLICY_EXCEPTION_ENABLED:-false}
      ASSIST_POLICY_EXCEPTION_RETENTION_DAYS: ${ASSIST_POLICY_EXCEPTION_RETENTION_DAYS:-2555}
      ASSIST_POLICY_TIMEOUT_MS: ${ASSIST_POLICY_TIMEOUT_MS:-10000}
      POLICY_URL: ${POLICY_URL:-http://policy:4006}
      POLICY_INTERNAL_SECRET: ${POLICY_INTERNAL_SECRET:-}
      POLICY_RULE_CONTEXT_SECRET: ${POLICY_RULE_CONTEXT_SECRET:-}
      POLICY_AUDIT_HASH_SECRET: ${POLICY_AUDIT_HASH_SECRET:-}
      POLICY_EXCEPTION_MODEL: ${POLICY_EXCEPTION_MODEL:-deepseek/deepseek-v4.1-flash-1017}
      POLICY_EXCEPTION_PROMPT_VERSION: ${POLICY_EXCEPTION_PROMPT_VERSION:-policy-exception-v1}
      POLICY_EXCEPTION_AGENT_VERSION: ${POLICY_EXCEPTION_AGENT_VERSION:-policy-exception-agent-v1}
      POLICY_EXCEPTION_VALIDATOR_VERSION: ${POLICY_EXCEPTION_VALIDATOR_VERSION:-policy-exception-validator-v1}
      POLICY_EXCEPTION_MAX_STEPS: ${POLICY_EXCEPTION_MAX_STEPS:-24}
      POLICY_EXCEPTION_MAX_TOOL_CALLS: ${POLICY_EXCEPTION_MAX_TOOL_CALLS:-32}
      POLICY_EXCEPTION_TIMEOUT_MS: ${POLICY_EXCEPTION_TIMEOUT_MS:-90000}
      POLICY_EXCEPTION_MAX_COST_USD: ${POLICY_EXCEPTION_MAX_COST_USD:-0.25}
      POLICY_EXCEPTION_MAX_OUTPUT_TOKENS: ${POLICY_EXCEPTION_MAX_OUTPUT_TOKENS:-4000}
      POLICY_EXCEPTION_RATE_PER_MIN: ${POLICY_EXCEPTION_RATE_PER_MIN:-10}
      CONTEXT_HISTORY_MONTHS: ${CONTEXT_HISTORY_MONTHS:-6}
      PORT: "4001"
      HOST: 0.0.0.0
      # T01 document workflow (SPEC-t01-t02 §10): encrypted blobs land under
      # /data/documents, bind-mounted to the host `.data/documents` tree so
      # host CLIs (demo:seed/verify) and the containerized service read and
      # write the same bytes. The scanner resolves via container networking.
      # Feature flag stays off until D1 lands, so these are inert until then.
      DOCUMENT_STORAGE_DIR: /data/documents
      # T17 customer evidence (SPEC-t17-t18 §2.2, D2a): disjoint
      # host `.data/customer-documents` bind-mount, so the T01 app orphan
      # sweep can never touch customer blobs; the D2a customer sweep owns
      # this root.
      CUSTOMER_STORAGE_DIR: /data/customer-documents
      CUSTOMER_RETENTION_DAYS: ${CUSTOMER_RETENTION_DAYS:-90}
      # D2a demo fixtures (SPEC-t17-t18 §2.5): the manifest owns DEMO_AS_OF;
      # the service clock must agree with it or seed/verify refuse.
      DEMO_MODE: ${DEMO_MODE:-true}
      DEMO_AS_OF: ${DEMO_AS_OF:-2026-06-30}
      DEMO_SEED_VERSION: ${DEMO_SEED_VERSION:-1}
      DEMO_RESET_ALLOWED: ${DEMO_RESET_ALLOWED:-false}
      DOCUMENT_FEATURE_ENABLED: ${DOCUMENT_FEATURE_ENABLED:-false}
      DOCUMENT_ENCRYPTION_KEY: ${DOCUMENT_ENCRYPTION_KEY:-}
      DOCUMENT_KEY_ID: ${DOCUMENT_KEY_ID:-v1}
      DOCUMENT_PREVIOUS_KEYS: ${DOCUMENT_PREVIOUS_KEYS:-}
      DOCUMENT_SCANNER: ${DOCUMENT_SCANNER:-clamd}
      DOCUMENT_OCR_DATA_DIR: ${DOCUMENT_OCR_DATA_DIR:-}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
    volumes:
      - .:/app
      - svc-node-modules:/app/node_modules
      # Host/container storage consistency (SPEC-t17-t18 §2.5): the same
      # `.data/` bytes the host seed/verify CLIs write are what the service
      # reads — never a divergent named volume.
      - ./.data/documents:/data/documents
      - ./.data/customer-documents:/data/customer-documents
    depends_on:
      deps:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      temporal:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r = await fetch('http://127.0.0.1:4001/health'); if (!r.ok) throw new Error(String(r.status)); const j = await r.json(); if (j.status !== 'ok') throw new Error(j.status);",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  review:
    <<: *svc-base
    image: oven/bun:1.4.3
    working_dir: /app
    command: ["bun", "apps/review/src/server.ts"]
    ports: ["4002:4002"]
    environment:
      APPLICATIONS_URL: http://applications:4001
      LOANS_URL: http://loans:4003
      TEMPORAL_ADDRESS: temporal:7233
