  # T01 malware scanner (SPEC-t01-t02 §10): ClamAV daemon on the standard
  # 3310 port. Best-effort in v1 — nothing depends on it (applications
  # stays healthy without it; uploads fail closed with 503 until D1), and
  # the gateway never routes here.

  # Durable agent runs (docs/explanation/agent-layout.md): Node-only
  # Temporal workers, one per owning service, own task queue, no ports.
  research-agent-worker:
    <<: *svc-base
    image: node:26-slim
    working_dir: /app
    command: ["node", "--import", "tsx", "apps/research/src/agent-worker.ts"]
    environment:
      <<: *research-env
    stop_grace_period: 30s
    depends_on:
      deps:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started

  applications-agent-worker:
    <<: *svc-base
    image: node:26-slim
    working_dir: /app
    command: ["node", "--import", "tsx", "apps/applications/src/agent-worker.ts"]
    environment:
      <<: *applications-env
    stop_grace_period: 30s
    depends_on:
      deps:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started

  clamav:
    image: clamav/clamav:latest
    restart: unless-stopped
    profiles: ["microservices"]
    ports: ["3310:3310"]

volumes:
  svc-node-modules:
