      timeout: 5s
      retries: 12
      start_period: 90s

  worker:
    <<: *svc-base
    image: node:26-slim
    working_dir: /app
    # tsx resolves from the deps-populated /app/node_modules. No port, no
    # healthcheck — the restart policy owns liveness.
    command: ["node", "--import", "tsx", "apps/worker/src/index.ts"]
    environment:
      APPLICATIONS_DATABASE_URL: postgres://credit:credit@postgres:5432/credit_applications
