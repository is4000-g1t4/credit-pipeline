      POLICY_EMBEDDING_PROVIDERS: ${POLICY_EMBEDDING_PROVIDERS:-}
      POLICY_ANSWERER_PROVIDER_ORDER: ${POLICY_ANSWERER_PROVIDER_ORDER:-}
      POLICY_AGENT_MODEL: ${POLICY_AGENT_MODEL:-deepseek/deepseek-v4.1-flash-1017}
      POLICY_AGENT_TEMPERATURE: ${POLICY_AGENT_TEMPERATURE:-0.1}
      POLICY_AGENT_MAX_OUTPUT_TOKENS: ${POLICY_AGENT_MAX_OUTPUT_TOKENS:-6000}
      POLICY_AGENT_TIMEOUT_MS: ${POLICY_AGENT_TIMEOUT_MS:-60000}
      POLICY_CASE_TIMEOUT_MS: ${POLICY_CASE_TIMEOUT_MS:-45000}
      POLICY_AGENT_MAX_COST_USD: ${POLICY_AGENT_MAX_COST_USD:-0.10}
      POLICY_CASE_MAX_COST_USD: ${POLICY_CASE_MAX_COST_USD:-0.20}
      POLICY_NAV_DAILY_BUDGET_USD: ${POLICY_NAV_DAILY_BUDGET_USD:-2.0}
      POLICY_CASE_DAILY_BUDGET_USD: ${POLICY_CASE_DAILY_BUDGET_USD:-2.0}
      POLICY_ACTOR_DAILY_BUDGET_USD: ${POLICY_ACTOR_DAILY_BUDGET_USD:-1.0}
      POLICY_RESERVATION_TTL_SECONDS: ${POLICY_RESERVATION_TTL_SECONDS:-180}
      POLICY_INDEX_RETENTION_HOURS: ${POLICY_INDEX_RETENTION_HOURS:-24}
      POLICY_RETRIEVAL_TOP_K: ${POLICY_RETRIEVAL_TOP_K:-8}
      POLICY_JURISDICTION: ${POLICY_JURISDICTION:-SG}
