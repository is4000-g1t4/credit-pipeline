  gateway:
    <<: *svc-base
    image: oven/bun:1.4.3
    working_dir: /app
    command: ["bun", "apps/gateway/src/server.ts"]
    ports: ["3001:3001"]
    environment:
      AUTH_DATABASE_URL: postgres://credit:credit@postgres:5432/credit_auth
      TEMPORAL_ADDRESS: temporal:7233
      KAFKA_BROKERS: kafka:29092
      SESSION_SECRET: ${SESSION_SECRET}
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      DEMO_MODE: ${DEMO_MODE:-true}
      NODE_ENV: development
      WEB_ORIGIN: http://localhost:3000
      API_PORT: "3001"
      API_HOST: 0.0.0.0
      APPLICATIONS_URL: http://applications:4001
      REVIEW_URL: http://review:4002
      LOANS_URL: http://loans:4003
      PORTFOLIO_URL: http://portfolio:4004
      POLICY_URL: http://policy:4006
      POLICY_UPSTREAM_TIMEOUT_MS: ${POLICY_UPSTREAM_TIMEOUT_MS:-75000}
      POLICY_ASK_RATE_PER_MIN: ${POLICY_ASK_RATE_PER_MIN:-10}
    depends_on:
      deps:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      temporal:
        condition: service_started
      applications:
        condition: service_healthy
      review:
        condition: service_healthy
      loans:
        condition: service_healthy
      portfolio:
        condition: service_healthy
      policy:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r = await fetch('http://127.0.0.1:3001/api/health'); if (!r.ok) throw new Error(String(r.status)); const j = await r.json(); if (j.status !== 'ok') throw new Error(j.status);",
