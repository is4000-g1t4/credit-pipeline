      LOANS_URL: http://loans:4003
      KAFKA_BROKERS: kafka:29092
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      PORT: "4004"
      HOST: 0.0.0.0
    depends_on:
      deps:
