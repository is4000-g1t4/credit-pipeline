packages:
  - apps/*
  - packages/*
  - scripts

# Default catalog: every external dependency used across the workspace pins
# one version here; each package.json references it via `"catalog:"`.
# (`workspace:*` is kept for the internal @credit/* links.)
catalog:
  "@t3-oss/env-core": 0.13.11
  "@grafana/agento11y": 0.14.0
  "@openai/agents": 0.8.0
  "@opentelemetry/exporter-metrics-otlp-http": 0.223.0
  "@opentelemetry/exporter-trace-otlp-http": 0.223.0
  "@opentelemetry/sdk-metrics": 2.12.0
  "@opentelemetry/sdk-node": 0.223.0
  "@playwright/test": 1.64.1
  "@shadcn/lint": 0.2.3
  class-variance-authority: 0.7.1
  cn: 0.5.0
  lucide-react: 1.61.0
  radix-ui: 1.8.1
  "@tailwindcss/vite": 4.3.3
  "@tanstack/react-query": 5.104.4
  "@tanstack/react-router": 1.170.45
  "@tanstack/react-start": 1.169.3
  "@temporalio/activity": 1.24.0
  "@temporalio/client": 1.24.0
  "@temporalio/testing": 1.24.0
  "@temporalio/worker": 1.24.0
  "@temporalio/workflow": 1.24.0
  "@types/node": 26.6.5
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": 6.1.2
  dotenv: 18.0.8
  drizzle-kit: 0.31.11
  drizzle-orm: 0.45.4
  hono: 4.13.13
  kafkajs: 2.2.4
  openai: 6.27.0
  nitro: 3.0.260903-beta
  oxfmt: 0.73.0
  oxlint: 1.88.0
  pino: 10.4.0
  pdfjs-dist: 6.4.299
  postgres: 3.4.9
  react: 19.3.1
  react-dom: 19.3.1
  tailwindcss: 4.3.3
  tesseract.js: 7.0.0
  tsx: 4.23.15
  typescript: 7.0.2
  vite: 8.3.4
  vitest: 5.0.5
  zod: 4.6.7

# pnpm 12 keeps build-script approvals here (`allowBuilds`; the `pnpm`
# field in package.json is ignored). Non-interactive installs work because
# the needed scripts (esbuild, protobufjs) are pre-approved — do not remove.
allowBuilds:
  esbuild: true
  pdfjs-dist: true
  tesseract.js: true
  protobufjs: true
  "@swc/core": true
  "@google/genai": true
  sqlite3: true
  tree-sitter: true
